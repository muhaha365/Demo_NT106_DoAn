Tôi đang là sinh viên năm 2 của trường đại học công nghệ thông tin, đang học ngành mạng máy tính.
Hiện tại tôi đang học môn lập tình mạng căn bản. Ở môn này, nhóm tôi phải làm đồ án về desktop app.
Môn học này học thực hành bằng winform application c#. Tuy nhiên khi làm đồ án chúng tôi có thể lựa chọn ngôn ngữ khác.
Chúng tôi quyết định lựa chọn đề tài là: "Ứng dụng nhắn tin, chat" với các tính năng mà giảng viên tôi đã gợi ý
- Đăng nhập/Đăng ký (Email, SĐT, Google)
- Danh sách bạn bè (Tìm kiếm, thêm, xóa)
- Nhắn tin cá nhân (Real-time, trạng thái ""đã xem"", ""đang nhập..."")
- Nhắn tin nhóm (Tạo nhóm, quản lý thành viên)
- Gửi file, hình ảnh, video (Xem trước, giới hạn dung lượng)
- Thông báo đẩy (Tin nhắn mới, yêu cầu kết bạn)
Hiện tại chúng tôi đã lên được những tính năng của riêng chúng tôi như sau: 
"Xác thực người dùng, Đăng ký tài khoản (username + password), Đăng nhập / đăng xuất, Lưu session (optional), Chat 1-1, Gửi tin nhắn text realtime, Hiển thị lịch sử chat, Phân biệt tin nhắn mình / người khác, Timestamp (thời gian gửi), 
Trạng thái người dùng, Online / Offline, Hiển thị danh sách user đang online, Kiến trúc client-server, 1 server trung tâm, Nhiều client kết nối, Giao tiếp qua TCP Socket, 
Danh sách bạn bè, Thêm bạn, Xóa bạn, Tìm kiếm user, Chat nâng cao, Hiển thị "đang nhập..." (typing), Seen / đã xem, Gửi emoji cơ bản, Chat nhóm, Tạo group, 
Thêm / xóa thành viên, Chat trong group, Notification, Thông báo khi có tin nhắn mới, Popup nhỏ (WinForms), Bảo mật, Hash password (SHA256), Mã hóa tin nhắn cơ bản, UI/UX, Tìm tin nhắn trong đoạn chat"

